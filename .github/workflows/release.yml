name: release

# Builds native installers for macOS (Intel + Apple Silicon), Windows, and
# Linux, then attaches them to a draft GitHub Release. Push a tag like
# `v0.1.0-alpha.1` to trigger it, or run it manually from the Actions tab.
#
# Builds are unsigned (no Apple/Windows code-signing certs configured), so
# macOS shows an "unidentified developer" warning and Windows shows a
# SmartScreen prompt on first launch — expected for an unsigned alpha build.
#
# Cloud features need VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY set as repo
# secrets — Vite inlines them at build time, so without them a shipped binary
# has sign-in and sync permanently disabled. The anon key is designed to be
# public (it ships in every Supabase client bundle; RLS is what protects the
# data), so embedding it in a release build is expected, not a leak.
# If the secrets are absent the build still succeeds and degrades to
# local-only Personal mode.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by `pnpm build` (the beforeBuildCommand) and inlined by Vite.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          # Releases are named after the git tag that triggered them, so
          # pushing v0.3.0 publishes to v0.3.0. Manual (workflow_dispatch)
          # runs get a clearly-separate dev tag so they can never overwrite
          # a real release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-build-{0}', github.run_number) }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('DevTask {0}', github.ref_name) || format('DevTask dev build {0}', github.run_number) }}
          releaseBody: |
            Unsigned build. On macOS: right-click the app and choose Open the
            first time to bypass Gatekeeper. On Windows: click "More info" ->
            "Run anyway" on the SmartScreen prompt.

            Personal mode works fully offline. Workspace (team cloud sync)
            requires your own Supabase project — see docs/SUPABASE_SETUP.md.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
