name = "devtask-web"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Static pages (landing, /auth/callback) are served from ./public. The Worker
# script only intercepts /download/* to resolve the latest release asset.
[assets]
directory = "./public"
binding = "ASSETS"

# Set this up in the Cloudflare dashboard once the Worker exists:
#   Workers & Pages -> devtask-web -> Settings -> Domains & Routes
#   -> Add custom domain -> devtask.lrdnd.com
